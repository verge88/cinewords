name: cinewords
description: Learn English through movies and videos with parallel subtitles
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  # State management
  provider: ^6.1.2

  # Supabase
  supabase_flutter: ^2.8.0

  # YouTube
  youtube_explode_dart: ^2.3.5
  #youtube_player_iframe: ^5.2.0
  flutter_inappwebview: ^6.1.5


  # Media
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # UI
  google_fonts: ^6.2.1
  dynamic_color: ^1.7.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.1.3

  # Utils
  flutter_tts: ^4.1.0
  translator: ^1.0.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  intl: ^0.19.0
  collection: ^1.18.0
  equatable: ^2.0.7

  # Icons
  material_design_icons_flutter: ^7.0.7296
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/

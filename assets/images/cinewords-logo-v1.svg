<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  
  <!-- Фон -->
  <rect width="200" height="200" fill="#ffffff"/>
  
  <!-- Абстрактный символ - объединение киноленты и буквы C -->
  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Основная форма - стилизованная C (кинематограф) -->
    <path d="M100 30 
             C55 30 30 60 30 100 
             C30 140 55 170 100 170" 
          stroke-width="8"/>
    
    <!-- Внутренняя дуга - создающая ощущение экрана/ленты -->
    <path d="M100 55 
             C70 55 55 75 55 100 
             C55 125 70 145 100 145" 
          stroke-width="4"/>
    
  </g>
  
  <!-- Три точки - субтитры/слова -->
  <g fill="#000000">
    <circle cx="85" cy="90" r="5"/>
    <circle cx="100" cy="100" r="5"/>
    <circle cx="85" cy="110" r="5"/>
  </g>
  
  <!-- Play треугольник внутри -->
  <polygon points="115,85 115,115 140,100" fill="#000000"/>
  
</svg>